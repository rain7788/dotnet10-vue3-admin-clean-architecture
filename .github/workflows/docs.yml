name: build-docs-images

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push (docs)
        uses: docker/build-push-action@v6
        with:
          context: ./docs
          file: ./docs/Dockerfile
          push: true
          tags: |
            ghcr.io/rain7788/art-docs:latest
            ghcr.io/rain7788/art-docs:sha-${{ github.sha }}
            ccr.ccs.tencentyun.com/rain7788/art-docs:latest
            ccr.ccs.tencentyun.com/rain7788/art-docs:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 65m
          script: |
            flock --wait 1800 /var/lock/art-admin-deploy.lock sh -eu -c '
              target_image=ccr.ccs.tencentyun.com/rain7788/art-docs:latest
              k3s kubectl -n apps patch deploy art-docs --type merge -p "{\"spec\":{\"progressDeadlineSeconds\":1800}}"
              current_image="$(k3s kubectl -n apps get deploy art-docs -o jsonpath="{.spec.template.spec.containers[0].image}")"
              if [ "$current_image" = "$target_image" ]; then
                k3s kubectl -n apps rollout restart deploy art-docs
              else
                k3s kubectl -n apps set image deploy/art-docs art-docs="$target_image"
              fi
              k3s kubectl -n apps rollout status deploy art-docs --timeout=30m
            '
